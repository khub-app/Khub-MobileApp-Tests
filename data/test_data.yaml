# Test inputs for the Khub PreProd Admin app.
# login.valid is the ONLY valid credential pair for this app (confirmed
# 2026-09-03) — the shared preprod tenant login used across all KHub suites.
login:
  valid:
    username: "preprod"
    password: "Password@123"
  invalid:
    username: "preprod"
    password: "wrong-password"

# E2E "create paid Online sale -> validate -> assign -> pick -> pack" test.
# All business data (customer, products, SKUs, prices, order number, totals)
# is generated per-run via the API - only the knobs below are fixed, and
# every one of them is overridable here without touching code.
online_sale:
  order_type: "Online"
  payment_mode: "Cash"
  product_count: 2              # 2-10 supported; kept at 2 so a run stays quick
  product_prices: [10.00, 12.50, 15.00, 8.75, 20.00]   # cycled if count > len
  quantities: [2, 3, 1, 1, 2]                          # cycled if count > len
  internal_note_prefix: "AUTO-INTERNAL"
  invoice_note_prefix: "AUTO-INVOICE"

# E2E "UOM product (4 tiers) -> paid Online sale -> validate -> assign ->
# pick -> pack" test. One product, configured with 4 chained packaging tiers
# (Piece/Pack/Case/Pallet, custom labels on the top 3), added as 4 SEPARATE
# order lines - mirrors khub-web-tests' UOM multi-unit scenario
# (PWkhubTest/UOM/test_uom_multi_unit_sale_fulfilment_validation_runner.py).
uom_sale:
  order_type: "Online"
  payment_mode: "Cash"
  # Order Qty on a placed cart line has no editable control in this app build
  # (confirmed live 2026-10-29 - the "Order Qty *" value is a plain read-only
  # View, not an EditText, and nothing opens a qty editor for it). Only the
  # FIRST tier (Piece) can get a chosen quantity, via the stepper shown
  # before "Add To Cart" is tapped. Every tier added afterward through
  # "Add another unit" is fixed at qty=1 - there is no UI path to anything
  # else, so this is validated as the real, current app behavior rather than
  # forced to match a quantity the app cannot produce.
  piece_qty: 2
  pack_desc: "Box"
  case_desc: "Carton"
  pallet_desc: "Package"
  pack_qty: 5            # Pieces per Box
  case_qty: 6            # Boxes per Carton
  pallet_qty: 30         # Cartons per Package
  base_cost: 10.00       # cost per Piece; other tiers scale from this
  internal_note_prefix: "AUTO-INTERNAL-UOM"
  invoice_note_prefix: "AUTO-INVOICE-UOM"
