[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

addopts = --alluredir=reports/allure-results --clean-alluredir -ra

markers =
    smoke: Quick smoke tests for critical admin-app flows
    regression: Full regression suite
    login: Login-related tests
    fulfillment: Sale Order + Fulfillment (pick/pack) end-to-end flows
    e2e: End-to-end business scenarios spanning multiple modules
    uom: UOM (multi-unit packaging tier) product flows
