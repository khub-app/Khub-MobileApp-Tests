default_environment: emulator

# Backend REST API credentials — used to look up data the admin app UI itself
# never surfaces, so tests can assert against the exact record they created.
# Same preprod tenant the admin APK ("Khub PreProd Admin") is built against.
backend_api:
  preprod:
    url: https://preprod.ikhub.biz
    username: preprod
    password: Password@123

environments:
  # Runs against the local Pixel_Tablet AVD already created in Android Studio.
  emulator:
    platform_name: Android
    automation_name: UiAutomator2
    device_name: emulator-5554
    platform_version: "15"                 # Pixel_Tablet AVD is API 35 / Android 15
    app_package: com.esolutions.demotaxadmin
    app_activity: com.esolutions.demotaxadmin.MainActivity
    app_path: data/apk/preprod-admin.apk   # Appium auto-installs this if the app is missing/outdated on the AVD (drop the APK here — it's gitignored)
    no_reset: true
    full_reset: false
    auto_grant_permissions: true
    new_command_timeout: 180
    appium_server: http://127.0.0.1:4723

  # Runs against a physical phone/tablet connected over USB with USB debugging on.
  # Fill udid/platform_version from `adb devices -l` and
  # `adb shell getprop ro.build.version.release`.
  real_device:
    platform_name: Android
    automation_name: UiAutomator2
    device_name: KHUB_Device
    udid: null
    platform_version: null
    app_package: com.esolutions.demotaxadmin
    app_activity: com.esolutions.demotaxadmin.MainActivity
    app_path: null
    no_reset: true
    full_reset: false
    auto_grant_permissions: true
    new_command_timeout: 180
    appium_server: http://127.0.0.1:4723
